[project]
name = "deepgram-self-hosted"
version = "0.1.0"
description = "Deepgram self-hosted setup tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2",
  "questionary>=2.0.1",
  "rich>=13.7.1",
  "typer>=0.12.5",
]

[project.scripts]
dg-self-hosted = "deepgram_self_hosted.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepgram_self_hosted"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
